name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes the older run.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests create and drop uniquely named databases on this throw-away CI service.
      JOBSEARCH_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci_only_not_a_secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore JobSearchTracker.slnx
      - run: dotnet tool restore
      - run: dotnet build JobSearchTracker.slnx --no-restore -c Release
      - name: EF model matches migrations
        env:
          ConnectionStrings__Default: Host=localhost;Database=design_time_only;Username=none;Password=none
        run: dotnet ef migrations has-pending-model-changes --project src/JobSearchTracker.Api --startup-project src/JobSearchTracker.Api --no-build --configuration Release
      - run: dotnet test JobSearchTracker.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  sonarqube:
    name: SonarQube Cloud analysis
    # Fork PRs do not receive GitHub OIDC permission.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    # The coverage run below executes the database tests, so it needs the same throw-away PostgreSQL service as the backend job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBSEARCH_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci_only_not_a_secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore .NET dependencies
        run: dotnet restore JobSearchTracker.slnx

      - name: Install frontend dependencies for TypeScript analysis
        run: npm ci --prefix web

      - name: Install SonarScanner for .NET
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sonar-scanner"
          dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar-scanner"

      - name: Authenticate to SonarQube Cloud (secretless)
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82
        with:
          export-env: false

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        shell: bash
        run: |
          "$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" begin \
            /k:"${{ steps.sonar-auth.outputs.project-key }}" \
            /o:"${{ steps.sonar-auth.outputs.organization }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/coverage/dotnet/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

      - name: Build solution for SonarQube analysis
        run: dotnet build JobSearchTracker.slnx --no-restore -c Release

      - name: Backend tests with coverage (OpenCover)
        run: >
          dotnet test JobSearchTracker.slnx --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory "$GITHUB_WORKSPACE/coverage/dotnet"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Frontend tests with coverage (LCOV)
        working-directory: web
        run: npm run test:coverage

      - name: Make LCOV paths relative to the repository root
        # Vitest writes SF: paths relative to web/; SonarQube resolves them from the repository root.
        run: sed -i -E 's#^SF:([^/])#SF:web/\1#' web/coverage/lcov.info

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        shell: bash
        run: |
          "$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" end \
            /d:sonar.token="$SONAR_TOKEN"
