# Weekly dependency update pull requests. They run the normal CI and are merged by the user, never automatically.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/"                                  # .config/dotnet-tools.json (dotnet-ef)
      - "/src/JobSearchTracker.Api"
      - "/src/JobSearchTracker.Worker"
      - "/tests/JobSearchTracker.Api.Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
    ignore:   # the app targets .NET 10 (LTS); move to a new .NET major as one deliberate task
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:   # keep @types/node on the Node major used by CI and Docker
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - "/src/JobSearchTracker.Api"
      - "/src/JobSearchTracker.Worker"
    schedule:
      interval: weekly
    ignore:   # .NET image major must match global.json and the net10.0 target
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
