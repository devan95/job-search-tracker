# Local-first stack. Every published port is bound to 127.0.0.1: nothing is
# exposed beyond this machine. The web app runs with `npm run dev` for now.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch -d jobsearch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema step. It is NOT started by `docker compose up` (profile "tools"); run it explicitly:
  #   docker compose run --rm migrate
  # It applies pending EF Core migrations and exits. Safe to repeat; it never drops data.
  migrate:
    profiles: ["tools"]
    image: jobsearchtracker-api:local
    build:
      context: .
      dockerfile: src/JobSearchTracker.Api/Dockerfile
    command: ["--MigrateOnly=true"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=jobsearch;Username=jobsearch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: jobsearchtracker-api:local
    build:
      context: .
      dockerfile: src/JobSearchTracker.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=jobsearch;Username=jobsearch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/JobSearchTracker.Worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
