# Local-first stack. Every published port is bound to 127.0.0.1: nothing is
# exposed beyond this machine. The web app runs with `npm run dev` for now.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch -d jobsearch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/JobSearchTracker.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=jobsearch;Username=jobsearch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/JobSearchTracker.Worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
